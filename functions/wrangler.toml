# Kul ve Taht - Cloudflare Workers / Durable Objects / D1
#
# YALNIZCA Workers FREE plan ozellikleri. Ucretli plana gecis tetikleyen
# hicbir ayar yoktur. Yerel gelistirme (`wrangler dev`) Miniflare ile
# D1/DO'yu HESAP GEREKTIRMEDEN ve UCRETSIZ emule eder.
#
# R2 kullanilmaz: yedekleme D1 Time Travel (ucretsiz, 30 gun) ile, gorsel
# varliklar Worker [assets] statik sistemle sunulur. Bkz. docs/kota-butcesi.md
# ve docs/karar-kayitlari.md (ADR-010).

name = "kul-ve-taht-functions"
main = "src/index.ts"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

# --- Statik arayuz (SPA) - tek kaynakta arayuz + API (ucretsiz) ---
# Arayuz dosyalari (app/dist) ayni Worker'dan sunulur; /api/* yollari
# Worker'a duser. Boylece tarayicida kaynaklar arasi (CORS) sorun olmaz.
# `npm run build -w @kvt/app` once calistirilmalidir.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- D1 (SQLite) - yerel: .wrangler/state altinda emule edilir ---
[[d1_databases]]
binding = "DB"
database_name = "kul-ve-taht-db"
database_id = "59e60c73-2f63-40dc-966b-6cd42f1114c5"
migrations_dir = "../db/migrations"

# --- Durable Objects (parola hash kapisi; SQLite arka uc = Free plan) ---
[[durable_objects.bindings]]
name = "PASSWORD_HASH_GATE"
class_name = "PasswordHashGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasswordHashGate"]

# --- Yedekleme ---
# Ayri bir Workflow binding'i YOKTUR. Yedekleme D1 Time Travel ile yapilir:
# her D1 uretim veritabani otomatik olarak 30 gunluk geri donus noktasi tutar
# (ucretsiz, ek maliyet yok). Bkz. docs/yayin-kilavuzu.md bolum 5.

# --- Free plan sinirlari icinde kalma ---
# Workers: 100.000 istek/gun, 10 ms CPU
# D1: 5M okuma/gun, 100K yazma/gun, 5 GB
# DO: 100.000 istek/gun, 13.000 GB-s/gun
[observability]
enabled = true

# --- Zamanlanmis dunya turu (belge 8.8) ---
# Free plan Cron Triggers ile saatlik calisir; istek kotasindan bagimsizdir.
# Simulasyon katmanli ve partili oldugu icin tek turda yazma kotasi asilmaz.
[triggers]
crons = ["0 * * * *"]

# --- Yerel gelistirme degiskenleri ---
# Uretimde SESSION_SECRET YALNIZCA `wrangler secret put SESSION_SECRET` ile
# ayarlanir; buraya yazilan deger uretime GITMEZ. Yerelde `functions/.dev.vars`
# (git'e girmez) veya bu blogun bos kalmasi kullanilir.
[vars]
# SESSION_SECRET buraya YAZILMAZ: gizli deger depoya islenmez.
