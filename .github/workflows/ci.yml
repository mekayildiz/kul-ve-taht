name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `node:sqlite` (gercek SQLite motoru testleri icin) Node >= 22.5 gerektirir.
      # Node 24 LTS ile CI, yerel gelistirme ortamiyla ayni motorda calisir.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: 0 TL denetimi
        run: npm run check:paid
